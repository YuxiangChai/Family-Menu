services:
  menu:
    build: .
    restart: unless-stopped
    init: true
    env_file: server/.env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      MENU_DATA_DIR: /app/server/data
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - menu-data:/app/server/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  menu-data:
